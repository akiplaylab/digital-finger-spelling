<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>デジタル指話（50 音）</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <h1>デジタル指話（50 音）</h1>

  <div class="card">
    <div class="controls">
      <select id="sel"></select>

      <label class="toggle">
        <input type="checkbox" id="showDetails" />
        詳細表示
      </label>
    </div>

    <div class="sequenceTools">
      <label class="field">
        <span>文字列（例: こんにちは）</span>
        <input id="phraseInput" type="text" value="こんにちは" />
      </label>

      <label class="field speedField">
        <span>1 文字の表示時間: <b id="stepMsValue">600ms</b></span>
        <input id="stepMs" type="range" min="200" max="1500" step="100" value="600" />
      </label>

      <div class="sequenceActions">
        <button type="button" id="playSequenceBtn">再生</button>
        <button type="button" id="stopSequenceBtn">停止</button>
        <button type="button" id="exportGifBtn">GIF を作成</button>
      </div>

      <div id="sequenceStatus" class="sequenceStatus"></div>
    </div>

    <div class="pose">
      <div class="hand">
        <div class="handBox">
          <div class="fingers" id="leftFingers"></div>
          <div class="fingers" id="rightFingers"></div>
        </div>
      </div>
    </div>

    <details class="details">
      <summary>詳細</summary>
      <div class="meta" id="meta"></div>
    </details>
    <div class="grid" id="grid"></div>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>

</html>
