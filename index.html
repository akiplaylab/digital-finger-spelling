<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>デジタル指話（50 音）</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <div class="pageHeader">
    <h1>デジタル指話（50 音）</h1>
    <button type="button" id="themeToggleBtn" class="themeToggleBtn" aria-pressed="false">🌙 ダークモード</button>
  </div>

  <div class="card">
    <div class="pose mainStage">
      <div class="hand">
        <div class="handBox">
          <div class="fingers" id="leftFingers"></div>
          <div class="fingers" id="rightFingers"></div>
        </div>
      </div>
      <p class="stageKana" aria-live="polite"><span id="currentKana">あ</span></p>

      <div class="optionBar" aria-label="オプション">
        <button id="dakutenBtn" class="btn optBtn" type="button">゛</button>
        <button id="handakutenBtn" class="btn optBtn" type="button">゜</button>
        <button id="smallBtn" class="btn optBtn" type="button">小</button>
      </div>

    </div>

    <div class="sequenceTools">
      <label class="field">
        <span>文字列（例: ありがとう）</span>
        <input id="phraseInput" type="text" value="ありがとう" />
      </label>

      <label class="field speedField">
        <span>1 文字の表示時間: <b id="stepMsValue">600ms</b></span>
        <input id="stepMs" type="range" min="200" max="1500" step="100" value="600" />
      </label>

      <div class="sequenceActions">
        <button type="button" id="playSequenceBtn">再生</button>
        <button type="button" id="stopSequenceBtn">停止</button>
      </div>

      <div id="sequenceStatus" class="sequenceStatus"></div>
    </div>

    <div class="grid" id="grid"></div>

    <details class="details">
      <summary>仕組みの詳細（知りたい人向け）</summary>
      <div class="meta" id="meta"></div>
    </details>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>

</html>
