<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>デジタル指話（50 音）</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <h1>デジタル指話（50 音）</h1>

  <div class="card">
    <div class="controls">
      <select id="sel"></select>

      <label class="toggle">
        <input type="checkbox" id="showBits" checked />
        ビット表示
      </label>
    </div>

    <div class="pose">
      <div class="hand">
        <div class="handTitle">左手</div>
        <div class="handBox">
          <div class="fingers" id="leftFingers"></div>
        </div>
      </div>

      <div class="hand">
        <div class="handTitle">右手</div>
        <div class="handBox">
          <div class="fingers" id="rightFingers"></div>
        </div>
      </div>
    </div>

    <details class="details">
      <summary>詳細</summary>
      <div class="meta" id="meta"></div>
    </details>
    <div class="grid" id="grid"></div>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>

</html>
